<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>洛克王国宠物图鉴</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;
            padding: 20px;

            background: #0f172a;

            color: white;

            font-family: "Microsoft YaHei", sans-serif;

        }


        .header {

            position: sticky;

            top: 0;

            z-index: 10;

            background: #1e293b;

            padding: 20px;

            border-radius: 16px;

            margin-bottom: 20px;

        }


        .title {

            font-size: 28px;

            color: #facc15;

            margin-bottom: 15px;

        }


        .controls {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        input, select {

            background: #0f172a;

            color: white;

            border: 1px solid #475569;

            padding: 10px 15px;

            border-radius: 10px;

        }


        .count {

            margin-left: auto;

            color: #94a3b8;

        }


        .grid {

            display: grid;

            grid-template-columns:
repeat(auto-fill, minmax(180px, 1fr));

            gap: 18px;

        }


        .card {

            background: #1e293b;

            border-radius: 18px;

            padding: 15px;

            text-align: center;

            border: 1px solid #334155;

            transition: .2s;

        }


        .card:hover {

            transform: translateY(-5px);

            border-color: #38bdf8;

        }


        .img {

            height: 140px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #020617;

            border-radius: 15px;

        }


        .img img {

            max-width: 95%;

            max-height: 130px;

        }


        .name {

            margin-top: 10px;

            font-size: 17px;

            font-weight: bold;

        }


        .id {

            color: #94a3b8;

            font-size: 13px;

        }


        .lock {

            color: #f87171;

            cursor: pointer;

        }


        .ok {

            color: #34d399;

        }


    </style>


</head>


<body>


<div class="header">


    <div class="title">

        🐉 洛克王国宠物图鉴

    </div>


    <div class="controls">


        <input
                id="search"
                placeholder="搜索名称 / ID"
                oninput="filter()"
        />


        <select id="status"
                onchange="filter()">


            <option value="all">
                全部状态
            </option>


            <option value="ok">
                ✅ 已点亮
            </option>


            <option value="lock">
                ❌ 未点亮
            </option>


        </select>


        <select id="type"
                onchange="filter()">


            <option value="all">
                全部数据
            </option>


        </select>


        <div class="count" id="count">

            加载中...

        </div>


    </div>


</div>


<div id="grid" class="grid">

</div>

<script>

let pets = [];
let show = [];


const files = [
    "宠物大全.json",
    "战斗宠物.json",
    "新宠物.json",
    "宠物皮肤.json"
];



async function load(){


    pets=[];


    for(let file of files){

        try{

            let r = await fetch(
                "/static/json/"+file+"?t="+Date.now()
            );


            if(!r.ok)
                continue;


            let data = await r.json();



            data.forEach(x=>{

                x.type=file.replace(".json","");

            });


            pets.push(...data);


            console.log(file,data.length);


        }catch(e){

            console.log(e);

        }


    }



    /*
        根据id合并
        false 优先
    */


    let map=new Map();



    for(let p of pets){


        let id=String(p.id);



        if(!map.has(id)){

            map.set(id,p);

        }
        else{


            let old=map.get(id);


            if(old.unknown===false ||
               p.unknown===false){

                old.unknown=false;

            }


        }


    }



    pets=[...map.values()];


    console.log(
        "最终:",
        pets.length
    );



    show=pets;


    initType();

    render();


}




function initType(){


    let sel=document.getElementById("type");


    sel.innerHTML=
    `<option value="all">全部数据</option>`;


    let types=[
        ...new Set(
            pets.map(x=>x.type)
        )
    ];



    types.forEach(t=>{


        let o=document.createElement("option");

        o.value=t;

        o.innerText=t;


        sel.appendChild(o);


    });


}





function render(){


let box=document.getElementById("grid");



document.getElementById("count")
.innerText=
`共 ${show.length} 条`;




box.innerHTML=
show.map(p=>{


let lock=p.unknown===true;



return `


<div class="card">


<div class="img">

<img src="/static/img/${p.id}.png">

</div>


<div class="name">

${p.name}

</div>


<div class="id">

#${p.id}

</div>



<div
class="${lock?'lock':'ok'}"
onclick="light(${p.id})"
>


${lock
?
"❌ 未点亮(点击切换)"
:
"✅ 已点亮(点击切换)"
}


</div>



</div>


`;


}).join("");



}





function filter(){

let key=
document.getElementById("search")
.value.trim();


let status=
document.getElementById("status")
.value;


let type=
document.getElementById("type")
.value;



show=pets.filter(p=>{


let a=
!key ||
p.name.includes(key) ||
String(p.id).includes(key);



let b=
status=="all" ||
(status=="lock" && p.unknown) ||
(status=="ok" && !p.unknown);



let c=
type=="all" ||
p.type==type;



return a&&b&&c;



});


render();


}






async function light(id){



console.log(
"点亮:",
id
);



let r=await fetch(
"/api/light",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
id:id
})


});



let data=await r.json();



console.log(data);



if(data.success){

    alert(
        data.result[0].new
        ?
        "已取消点亮"
        :
        "已点亮"
    );


    await load();

}


else{


alert(
"失败:"+JSON.stringify(data)
);


}



}



load();


</script>


</body>


</html>
